<!doctype html>
<html lang="en">
<body style="font-family:Arial,sans-serif;color:#202124;line-height:1.5">
  <h1 style="font-size:22px">Reset your password</h1>
  <p>Hello {{Name}},</p>
  <p>Use the button below to choose a new Campus Events password. This link expires in {{ExpiresIn}} and can only be used once.</p>
  <p><a href="{{ResetUrl}}" style="display:inline-block;padding:12px 18px;background:#0d6efd;color:#fff;text-decoration:none;border-radius:5px">Reset password</a></p>
  <p>If you did not request this reset, you can ignore this email.</p>
</body>
</html>
